services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkpoint
      POSTGRES_USER: checkpoint
      POSTGRES_PASSWORD: checkpoint
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint -d checkpoint"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - checkpoint-postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkpoint_test
      POSTGRES_USER: checkpoint
      POSTGRES_PASSWORD: checkpoint
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint -d checkpoint_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  checkpoint-postgres:
